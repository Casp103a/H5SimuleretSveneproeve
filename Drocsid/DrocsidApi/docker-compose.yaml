services:
  postgres:
    image: postgres:17
    container_name: drocsid-db
    restart: always
    environment:
      POSTGRES_DB: drocsid
      POSTGRES_USER: Flemming
      POSTGRES_PASSWORD: NogetJegKanHuske
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  drocsidapi:
    build:
      context: ..
      dockerfile: DrocsidApi/Dockerfile
    container_name: drocsid-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    restart: unless-stopped
    depends_on:
      - postgres


  cloudflare-tunnel:

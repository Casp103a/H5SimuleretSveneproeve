    environment:
      - TUNNEL_TOKEN=eyJhIjoiYWJjYzFjNzk2Njk0MDUxNTBmZTA2ZTVlYjUxYjg5YjQiLCJ0IjoiNjA0NjM0NTktOTM2NC00MTZlLThhMzItNmQxMTBlOGI5NjEzIiwicyI6Ik9UWTRNakJpTkRjdE9EQTFZUzAwT0RjNUxUazJabVV0WlRCa05tSTFPVEZoTkRFMCJ9


  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
